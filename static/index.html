<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>finger-pos · AI Camera</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><span>●</span> FINGER-POS</div>
    <nav>
      <a href="#sec-dash" class="active"><span>📊</span> Dashboard</a>
      <a href="#sec-gesture"><span>✋</span> Gesture</a>
      <a href="#sec-music"><span>🎵</span> Music</a>
      <a href="#sec-volume"><span>🔊</span> Volume</a>
      <a href="#sec-settings"><span>⚙️</span> Settings</a>
      <a href="#sec-logs"><span>📜</span> Logs</a>
    </nav>
    <div class="side-foot">local-only</div>
  </aside>
  <main>
    <header>
      <span class="header-title">AI CAMERA</span>
      <span class="status-badge" id="h-cam"><span class="status-dot"></span> Camera</span>
      <span class="status-badge" id="h-back"><span class="status-dot"></span> Backend</span>
      <span class="status-badge" id="h-ws"><span class="status-dot"></span> WebSocket</span>
    </header>

    <section id="sec-dash" class="panel wide">
      <div class="camrow">
        <img id="video" alt="Camera offline" src="">
        <div class="cambtns">
          <button id="b-start">Start Camera</button>
          <button id="b-stop">Stop Camera</button>
          <button id="b-gon">Enable Gestures</button>
          <button id="b-goff">Disable Gestures</button>
        </div>
      </div>
    </section>

    <section id="sec-gesture" class="panel">
      <h2>Gesture</h2>
      <div class="bigname" id="g-name">—</div>
      <div class="bar"><div id="g-conf"></div></div>
      <div class="kv"><span>State</span><b id="g-state">UNKNOWN</b></div>
      <div class="kv"><span>Hands</span><b id="g-hands">0</b></div>
      <div class="kv"><span>Faces</span><b id="g-faces">0</b></div>
    </section>

    <section id="sec-music" class="panel">
      <h2>Music</h2>
      <div class="bigname small" id="m-track">No player</div>
      <div class="kv"><span>Control</span><b id="m-ctl">OFF</b></div>
      <div class="btnrow">
        <button id="m-prev">⏮ Prev</button>
        <button id="m-toggle">⏯ Play/Pause</button>
        <button id="m-next">Next ⏭</button>
      </div>
    </section>

    <section id="sec-volume" class="panel">
      <h2>Volume <span id="v-mode" class="badge">MANUAL</span></h2>
      <div class="bigname"><span id="v-pct">—</span><span class="pct">%</span></div>
      <input type="range" id="v-slider" min="0" max="100" value="50">
      <div class="btnrow">
        <button id="v-down">−</button>
        <button id="v-mute">Mute</button>
        <button id="v-up">+</button>
      </div>
      <div class="kv"><span>Muted</span><b id="v-muted">No</b></div>
    </section>

    <section id="sec-settings" class="panel">
      <h2>Settings</h2>
      <label>Smoothing <input type="range" id="s-smooth" min="0" max="100" value="20"><b id="s-smooth-v">0.20</b></label>
      <label>Debounce <input type="range" id="s-debounce" min="1" max="10" value="3"><b id="s-debounce-v">3</b></label>
      <label>Strength <input type="range" id="s-strength" min="1" max="10" value="5"><b id="s-strength-v">5</b></label>
      <label>Blur <select id="s-kind"><option>GAUSSIAN</option><option>PIXELATE</option></select></label>
      <label>Privacy <select id="s-privacy"><option>OFF</option><option>FACE_BLUR</option><option>STRICT</option><option>AUTO</option></select></label>
      <label>Sensitivity <select id="s-sens"><option value="low">Low</option><option value="normal" selected>Normal</option><option value="high">High</option></select></label>
      <button id="s-apply" style="margin-top:12px;width:100%">Apply Settings</button>
    </section>

    <section id="sec-logs" class="panel wide">
      <h2>Event Log</h2>
      <ol id="log"></ol>
    </section>
  </main>
</div>
<div id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
